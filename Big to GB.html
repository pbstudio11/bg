<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Big5 to GB :: 繁簡轉換</title>
</head>
<body>
  <div align="center">
    <form id="myForm" onsubmit="return false;">
      <table border="0" width="600" id="table1">
        <tbody>
          <tr>
            <td align="center">
              <textarea rows="7" id="S1" name="S1" cols="60" style="font-size:12pt"></textarea><br>
              TO：
              <input type="button" value="CN Unicode" name="B1" onclick="BIGtoGB=0;toCode()">
              <input type="button" value="TW Unicode" name="B2" onclick="BIGtoGB=1;toCode()">
              <input type="button" value="CN GB" name="B3" onclick="BIGtoGB=2;toCode()">
              <input type="button" value="TW BIG" name="B4" onclick="BIGtoGB=3;toCode()">
              &nbsp;&nbsp;&nbsp;&nbsp;
              <input type="checkbox" id="C1" name="C1" value="ON">HTML<br>
              <textarea rows="7" id="S2" name="S2" cols="60" style="font-size:12pt"></textarea>
            </td>
          </tr>
        </tbody>
      </table>
    </form>
  </div>

  <div id="p1" style="display:none"></div>

  <!-- 請確保以下 .js 檔名與你資料夾入面嘅實際檔名一致（建議去掉「.下載」） -->
  <script src="./Big5 to GB/GB2312TOBIG5.js"></script>
  <script src="./Big5 to GB/GBCodeUnicode.js"></script>
  <script src="./Big5 to GB/GB2312TOBIGGB.js"></script>
  <script src="./Big5 to GB/BIG5TOGB2312.js"></script>
  <script src="./Big5 to GB/BIGCodeUnicode.js"></script>
  <script src="./Big5 to GB/BIG5TOGBBIG.js"></script>

  <script>
    var BIGtoGB = 0;

    function toCode() {
      var TempStr = "";
      var TempStr1 = "";
      var TempStrWord = "";
      var TempWordMath = 0;

      var s1El = document.getElementById("S1");
      var s2El = document.getElementById("S2");
      var c1El = document.getElementById("C1");
      var p1El = document.getElementById("p1");

      if (c1El.checked) {
        p1El.innerHTML = s1El.value;
        TempStrWord = p1El.innerText;
      } else {
        TempStrWord = s1El.value;
      }

      for (var i = 0; i < TempStrWord.length; i++) {
        TempStr1 = TempStrWord.charAt(i);
        TempWordMath = TempStr1.charCodeAt(0);

        switch (BIGtoGB) {
          case 0:
            TempStr += (!window.toGB || !toGB[TempWordMath]) ? TempStr1 : String.fromCharCode(toGB[TempWordMath]);
            break;
          case 1:
            TempStr += (!window.toBIG || !toBIG[TempWordMath]) ? TempStr1 : String.fromCharCode(toBIG[TempWordMath]);
            break;
          case 2:
            TempStr += (!window.toGB2 || !toGB2[TempWordMath]) ? TempStr1 : toGB2[TempWordMath];
            break;
          case 3:
            TempStr += (!window.toBIG2 || !toBIG2[TempWordMath]) ? TempStr1 : toBIG2[TempWordMath];
            break;
        }
      }

      s2El.value = TempStr;
    }
  </script>
</body>
</html>
